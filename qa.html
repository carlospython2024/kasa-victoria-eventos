<!doctype html><html lang="es"><head><meta charset="UTF-8"><title>Verificación responsive</title><style>body{overflow:hidden;margin:0;background:#dfe3df;font:13px system-ui;color:#234539}header{padding:12px 20px;background:white;display:flex;align-items:center;gap:15px}select,button{font:inherit;padding:7px;border:1px solid #a6b5a8;border-radius:6px}main{display:flex;justify-content:center;padding:20px}#frame{border:0;box-shadow:0 4px 30px #0002;background:white;transform-origin:top left}#holder{position:relative}</style></head><body><header><strong>QA responsive</strong><select id="size" aria-label="Resolución"><option value="1440,900">1440 × 900</option><option value="768,1024">768 × 1024</option><option value="390,844">390 × 844</option></select><select id="route" aria-label="Página"><option value="/">Inicio</option><option value="/crear?modelo=jardin-botanico">Solicitud</option><option value="/gestion">Gestión</option><option value="/privacidad">Privacidad</option><option value="/#modelos">Catálogo</option><option value="/#celebraciones">Celebraciones</option><option value="/propuesta/bodas-colombia?modelo=jardin-botanico">Propuesta</option><option value="/demo/jardin-botanico">Boda botánica</option><option value="/demo/magnolia-editorial">Boda magnolia</option><option value="/demo/rosa-contemporanea">Boda rosa</option><option value="/celebraciones/16-anos">16 años</option><option value="/celebraciones/primera-comunion">Comunión</option><option value="/celebraciones/grado">Grado</option><option value="/celebraciones/infantil">Infantil</option><option value="/celebraciones/baby-shower">Baby shower</option></select><span id="report"></span></header><main><div id="holder"><iframe id="frame" title="Vista de verificación"></iframe></div></main><script>const frame=document.getElementById('frame'),holder=document.getElementById('holder'),size=document.getElementById('size'),route=document.getElementById('route');function fit(){const[w,h]=size.value.split(',').map(Number),s=Math.min(1,(innerWidth-40)/w,(innerHeight-100)/h);frame.style.width=w+'px';frame.style.height=h+'px';frame.style.transform='scale('+s+')';holder.style.width=w*s+'px';holder.style.height=h*s+'px';}function load(){frame.src=route.value;fit()}function report(){const d=frame.contentDocument;if(!d)return;const broken=[...d.images].filter(i=>i.complete&&i.naturalWidth===0).length;document.getElementById('report').textContent='Desbordamiento: '+(d.documentElement.scrollWidth>d.documentElement.clientWidth?'SÍ':'no')+' · Imágenes rotas: '+broken;}size.onchange=fit;route.onchange=load;window.onresize=fit;frame.onload=report;setInterval(report,1500);const params=new URLSearchParams(location.search);if(params.has('size'))size.value=params.get('size');if(params.has('route'))route.value=params.get('route');load();</script></body></html>
